<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Menu</title>
    <!-- Pure Bootstrap 5.3 CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- Content Security Policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' https://cdn.jsdelivr.net; script-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:;"
    />
  </head>
  <body class="bg-light">
    <!-- Main Responsive Container -->
    <div class="container py-4">
      <div class="row g-4">
        <!-- Menu Column -->
        <div class="col-12 col-lg-5">
          <h1 class="mb-4">Our Menu</h1>
          <div class="row g-3">
            <div class="col-12 col-md-6 col-lg-6">
              <div class="card h-100 shadow-sm">
                <!-- ⚡ Bolt: Use fetchpriority="high" and decoding="async" for faster LCP -->
                <img
                  src="calamari.jpg"
                  alt="Fried Calamari"
                  class="card-img-top"
                  fetchpriority="high"
                  decoding="async"
                  loading="lazy"
                />
                <div class="card-body">
                  <h2 class="card-title h5 d-flex justify-content-between align-items-center">
                    Fried Calamari <span class="badge bg-primary">New</span>
                  </h2>
                  <p class="card-text text-muted">Squid, buttermilk.</p>
                </div>
              </div>
            </div>

            <div class="col-12 col-md-6 col-lg-6">
              <div class="card h-100 shadow-sm">
                <!-- ⚡ Bolt: Use loading="lazy" and decoding="async" to defer offscreen images and reduce main thread block -->
                <img
                  src="falafel.jpg"
                  alt="Image of Falafel"
                  class="card-img-top"
                  loading="lazy"
                  decoding="async"
                />
                <div class="card-body">
                  <h2 class="card-title h5">Falafel</h2>
                  <p class="card-text text-muted">Chicken, herbs and spices.</p>
                </div>
              </div>
            </div>

            <div class="col-12 col-md-6 col-lg-6">
              <div class="card h-100 shadow-sm">
                <!-- ⚡ Bolt: Use loading="lazy" and decoding="async" to defer offscreen images and reduce main thread block -->
                <img
                  src="salad.jpg"
                  alt="Image of a salad"
                  class="card-img-top"
                  loading="lazy"
                  decoding="async"
                />
                <div class="card-body">
                  <h2 class="card-title h5">Pasta Salad</h2>
                  <p class="card-text text-muted">Lettuce, vegetables and mozzarella.</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Prices Column -->
        <div class="col-12 col-lg-5">
          <div class="card shadow-sm p-3 mb-3">
            <h2 class="h4 mb-3">Prices</h2>
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <tbody>
                  <tr>
                    <td>Fried Calamari</td>
                    <td class="text-end fw-bold">$12.00</td>
                  </tr>
                  <tr>
                    <td>Falafel</td>
                    <td class="text-end fw-bold">$12.00</td>
                  </tr>
                  <tr>
                    <td>Pasta Salad</td>
                    <td class="text-end fw-bold">$10.00</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="alert alert-info shadow-sm" role="alert">
            Try our new Fried Calamari!
          </div>
        </div>

        <!-- Sidebar Promotion Column (Visible on large screens) -->
        <div class="col-lg">
          <div class="alert alert-primary shadow-sm" role="alert">
            I appear on the right when screen is large
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle with Popper CDN -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
